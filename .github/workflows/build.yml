name: Build Clinic Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Generate Zeemal Android launcher icon
        run: |
          mkdir -p assets
          test -f zeemal-health-clinic-logo.png
          cp zeemal-health-clinic-logo.png assets/icon-only.png
          npx capacitor-assets generate --android

      # Same signing key on every build, so the SHA-1 saved in Firebase always matches.
      - name: Install signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secret DEBUG_KEYSTORE_BASE64 is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -i "androiddebugkey" || { echo "::error::Signing key is invalid"; exit 1; }

      # Force Gradle to sign the APK with OUR key (the one registered in Firebase).
      - name: Use our signing key for the APK
        run: |
          cp ~/.android/debug.keystore android/app/zeemal-debug.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('zeemal-debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
          tail -15 android/app/build.gradle

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GitHub Secret GOOGLE_SERVICES_JSON is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e "
            const j=JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8'));
            const c=(j.client||[]).find(x=>x.client_info&&x.client_info.android_client_info.package_name==='com.zeemal.healthclinic');
            if(!c){console.error('::error::google-services.json is not for package com.zeemal.healthclinic');process.exit(1)}
            const hashes=((c.oauth_client||[]).map(o=>o.android_info&&o.android_info.certificate_hash).filter(Boolean));
            console.log('SHA-1 hashes in google-services.json:',hashes.join(', ')||'(none)');
            if(!hashes.includes('93fa080586bcae98308a6f9aa2c7aa8d3a9ee40e')){console.error('::error::SHA-1 93:FA:08... is missing in google-services.json. Add the fingerprint in Firebase, then download google-services.json again.');process.exit(1)}
            console.log('google-services.json OK');
          "

      - name: Enable native Google sign-in and camera
        run: |
          sed -i "s/^ext {/ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'/" android/variables.gradle
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          echo "---- variables.gradle ----"; cat android/variables.gradle
          echo "---- plugin gradle (google/credentials lines) ----"
          grep -n -i "rgcfa\|credentials\|googleid\|play-services-auth" node_modules/@capacitor-firebase/authentication/android/build.gradle || true

      - name: Sync Android project
        run: npx cap sync android

      - name: Force Zeemal launcher icon in Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(p)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")

          android_ns = "{http://schemas.android.com/apk/res/android}"
          app.set(android_ns + "icon", "@mipmap/ic_launcher")
          app.set(android_ns + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(p, encoding="utf-8", xml_declaration=True)

          # Parse again to verify the generated XML is valid and attributes are unique.
          check = ET.parse(p).getroot().find("application")
          assert check.get(android_ns + "icon") == "@mipmap/ic_launcher"
          assert check.get(android_ns + "roundIcon") == "@mipmap/ic_launcher_round"
          print("Valid manifest: Zeemal launcher icons configured")
          PY
          echo "---- Confirm launcher resources ----"
          find android/app/src/main/res -type f | sort | grep -E 'mipmap.*/ic_launcher'
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Prints the real signing fingerprint of the finished APK, so it can be compared with Firebase.
      - name: Show APK signing fingerprint
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "---- APK certificate (must be SHA-1 93:FA:08:05... = 93fa0805...) ----"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1\|SHA-256" || true
          echo "---- Key stored in GitHub secret ----"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -i "SHA1\|SHA256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeemal-Health-Clinic-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Windows app is built in its own small folder (winapp) so that the
      # Android/Capacitor packages in the main package.json cannot break it.
      - name: Prepare Windows app folder
        shell: bash
        run: |
          mkdir -p winapp/electron winapp/build
          cp electron/main.js winapp/electron/main.js
          cp electron/preload.js winapp/electron/preload.js
          cp index.html winapp/index.html
          for f in sw.js manifest.json zeemal-health-clinic-logo.png zeemal-health-clinic-logo.svg; do
            if [ -f "$f" ]; then cp "$f" "winapp/$f"; fi
          done
          if [ -f zeemal-health-clinic-logo.png ]; then cp zeemal-health-clinic-logo.png winapp/build/icon.png; fi
          cat > winapp/package.json <<'EOF'
          {
            "name": "zeemal-health-clinic",
            "version": "1.0.0",
            "description": "Zeemal Health Clinic Management System",
            "author": "Zeemal Health Clinic",
            "main": "electron/main.js",
            "devDependencies": {
              "electron": "^40.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.zeemal.healthclinic",
              "productName": "Zeemal Health Clinic",
              "directories": { "output": "dist" },
              "files": [
                "electron/**/*",
                "index.html",
                "sw.js",
                "manifest.json",
                "zeemal-health-clinic-logo.*",
                "package.json"
              ],
              "win": {
                "target": ["nsis", "portable"],
                "icon": "build/icon.png"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "artifactName": "Zeemal-Health-Clinic-Setup-${version}.${ext}"
              },
              "portable": {
                "artifactName": "Zeemal-Health-Clinic-Portable-${version}.${ext}"
              }
            }
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('winapp/package.json','utf8'));console.log('winapp/package.json is valid')"
          ls -R winapp

      - name: Install Windows build tools
        working-directory: winapp
        run: npm install --no-audit --no-fund

      - name: Build EXE
        working-directory: winapp
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - name: Show build output
        shell: bash
        run: ls -la winapp/dist

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Zeemal-Health-Clinic-Windows
          path: winapp/dist/*.exe
          if-no-files-found: error
