<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZMS Medical Store</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;color:#172033}
header{background:#087f5b;color:white;padding:20px}
main{padding:15px;max-width:800px;margin:auto}
nav{display:flex;gap:7px;flex-wrap:wrap;padding:12px;background:white}
button{background:#087f5b;color:white;border:0;padding:12px;border-radius:7px;margin:3px}
input,select{display:block;width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #bbb;border-radius:7px}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px}
section{display:none}
section.active{display:block}
table{width:100%;background:white;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<header><h2>💊 ZMS Medical Store</h2><p>Medical Store Management</p></header>
<nav>
<button onclick="show('home')">Dashboard</button>
<button onclick="show('medicines')">Medicines</button>
<button onclick="show('sale')">New Sale</button>
<button onclick="show('reports')">Reports</button>
</nav>
<main>
<section id="home" class="active">
<h3>Dashboard</h3>
<div class="card">Medicine types: <b id="total">0</b></div>
<div class="card">Total stock units: <b id="units">0</b></div>
<div class="card">Today's sales: <b id="today">Rs 0</b></div>
<div class="card">Low stock items: <b id="low">0</b></div>
</section>

<section id="medicines">
<div class="card">
<h3>Add Medicine</h3>
<form id="medform">
<label>Medicine name</label>
<input id="medname" required>
<label>Barcode (optional)</label>
<input id="medbarcode">
<label>Expiry date</label>
<input id="medexpiry" type="date" required>
<label>Purchase price (Rs)</label>
<input id="medbuy" type="number" min="0" step="0.01" required>
<label>Sale price (Rs)</label>
<input id="medsell" type="number" min="0" step="0.01" required>
<label>Quantity</label>
<input id="medqty" type="number" min="0" step="1" required>
<label>Low stock alert at</label>
<input id="medmin" type="number" min="0" value="10" required>
<button type="submit">Save Medicine</button>
</form>
<p id="medmsg"></p>
</div>
<div class="card">
<h3>Medicine Stock</h3>
<input id="search" placeholder="Search medicine">
<div class="wrap"><table>
<thead><tr><th>Name</th><th>Qty</th><th>Sale price</th><th>Expiry</th><th>Action</th></tr></thead>
<tbody id="medrows"></tbody>
</table></div>
</div>
</section>

<section id="sale">
<div class="card">
<h3>New Sale</h3>
<label>Medicine</label><select id="saleMed"></select>
<label>Quantity sold</label><input id="saleQty" type="number" min="1" value="1">
<button onclick="sellMedicine()">Complete Sale</button>
<p id="saleMsg"></p>
</div>
</section>

<section id="reports">
<div class="card">
<h3>Sales Report</h3>
<p>Total sales: <b id="allSales">Rs 0</b></p>
<p>Estimated profit: <b id="profit">Rs 0</b></p>
<div class="wrap"><table>
<thead><tr><th>Date</th><th>Medicine</th><th>Qty</th><th>Total</th><th>Profit</th></tr></thead>
<tbody id="salesrows"></tbody>
</table></div>
<button onclick="exportBackup()">Export Backup</button>
</div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const money = n => 'Rs ' + Number(n).toFixed(2);

function load(key){
 try{return JSON.parse(localStorage.getItem(key))||[]}
 catch(e){return []}
}
let medicines=load('zms_medicines');
let sales=load('zms_sales');

function saveData(){
 try{
 localStorage.setItem('zms_medicines',JSON.stringify(medicines));
 localStorage.setItem('zms_sales',JSON.stringify(sales));
 return true;
 }catch(e){
 alert('Data save nahi ho saka. Browser storage check karein.');
 return false;
 }
}

function show(id){
 document.querySelectorAll('main section').forEach(s=>s.classList.remove('active'));
 $(id).classList.add('active');
 render();
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

$('medform').addEventListener('submit',function(e){
 e.preventDefault();
 const m={
 id:Date.now(),
 name:$('medname').value.trim(),
 barcode:$('medbarcode').value.trim(),
 expiry:$('medexpiry').value,
 buy:Number($('medbuy').value),
 sell:Number($('medsell').value),
 qty:Number($('medqty').value),
 minqty:Number($('medmin').value)
 };

 if(!m.name||!m.expiry||m.buy<0||m.sell<0||
 !Number.isInteger(m.qty)||m.qty<0){
 $('medmsg').textContent='Please check all fields.';
 return;
 }

 medicines.push(m);
 if(!saveData()){
 medicines.pop();
 return;
 }
 this.reset();
 $('medmin').value=10;
 $('medmsg').textContent='Medicine successfully saved!';
 render();
});

$('search').addEventListener('input',render);

function sellMedicine(){
 const id=Number($('saleMed').value);
 const m=medicines.find(x=>x.id===id);
 const q=Number($('saleQty').value);

 if(!m||!Number.isInteger(q)||q<1){
 $('saleMsg').textContent='Select a medicine and valid quantity.';
 return;
 }
 if(m.qty<q){
 $('saleMsg').textContent='Not enough stock.';
 return;
 }
 if(m.expiry<new Date().toISOString().slice(0,10)){
 $('saleMsg').textContent='Expired medicine cannot be sold.';
 return;
 }

 m.qty-=q;
 const s={
 date:new Date().toISOString(),
 name:m.name,qty:q,total:q*m.sell,
 profit:q*(m.sell-m.buy)
 };
 sales.push(s);

 if(!saveData()){
 m.qty+=q;sales.pop();return;
 }
 $('saleMsg').textContent='Sale saved. Total: '+money(s.total);
 $('saleQty').value=1;
 render();
}

function deleteMedicine(id){
 if(confirm('Delete this medicine?')){
 medicines=medicines.filter(m=>m.id!==id);
 saveData();render();
 }
}

function render(){
 $('total').textContent=medicines.length;
 $('units').textContent=medicines.reduce((a,m)=>a+m.qty,0);
 const day=new Date().toISOString().slice(0,10);
 $('today').textContent=money(sales.filter(s=>s.date.slice(0,10)===day).reduce((a,s)=>a+s.total,0));
 $('low').textContent=medicines.filter(m=>m.qty<=m.minqty).length;

 const term=($('search').value||'').toLowerCase();
 $('medrows').innerHTML=medicines.filter(m=>m.name.toLowerCase().includes(term)).map(m=>
 `<tr><td>${esc(m.name)}</td><td>${m.qty}</td><td>${money(m.sell)}</td><td>${esc(m.expiry)}</td><td><button onclick="deleteMedicine(${m.id})">Delete</button></td></tr>`
 ).join('')||'<tr><td colspan="5">No medicines added.</td></tr>';

 $('saleMed').innerHTML=medicines.map(m=>
 `<option value="${m.id}">${esc(m.name)} (Stock ${m.qty})</option>`
 ).join('');

 $('allSales').textContent=money(sales.reduce((a,s)=>a+s.total,0));
 $('profit').textContent=money(sales.reduce((a,s)=>a+s.profit,0));
 $('salesrows').innerHTML=sales.slice().reverse().map(s=>
 `<tr><td>${esc(s.date.slice(0,10))}</td><td>${esc(s.name)}</td><td>${s.qty}</td><td>${money(s.total)}</td><td>${money(s.profit)}</td></tr>`
 ).join('')||'<tr><td colspan="5">No sales yet.</td></tr>';
}

function exportBackup(){
 const blob=new Blob([JSON.stringify({medicines,sales},null,2)],{type:'application/json'});
 const a=document.createElement('a');
 const url=URL.createObjectURL(blob);
 a.href=url;a.download='zms-backup.json';a.click();
 URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
